
name: Playwright Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Install Playwright explicitly to prevent a missing dependency
      - name: Ensure Playwright is installed
        run: |
          python -m pip install playwright
          python -m pip install pytest pytest-html

      - name: Verify installations
        run: |
          python --version
          python -m pip show playwright
          python -m playwright --version
          python -m pip show pytest
          python -m pip show pytest-html

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Create test directories
        run: |
          mkdir -p reports logs screenshots traces

      - name: Run tests
        run: |
          python -m pytest

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: reports/
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs
          path: logs/
          if-no-files-found: warn

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: Upload traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: traces/
          if-no-files-found: warn